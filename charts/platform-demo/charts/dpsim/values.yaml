replicaCount: 1

image:
  repository: ghcr.io/sogno-platform/dpsim/example-kafka-service:latest
  pullPolicy: IfNotPresent
  tag: "latest"

fullnameOverride: ""

configFile: "/config/configFile.conf"

simulationFile: "/default_simulation.py"

simulationLoop: "true"

resources:
  requests:
    memory: 2Gi
    hugepages-2Mi: 256Mi
  limits:
    memory: 2Gi
    hugepages-2Mi: 256Mi

securityContext:
  privileged: true
  allowPrivilegeEscalation: true
  runAsUser: 0

initContainers: []

config:
  type: ""
  format: ""
  protocol: ""
  clientId: ""
  outputTopic: ""
  broker: ""

